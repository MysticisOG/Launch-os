<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launch OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="desktop-shell">
      <header class="topbar">
        <div class="brand">Launch OS</div>
        <div class="status-pill">Live mission feed</div>
      </header>

      <main class="dashboard">
        <section class="clock-card">
          <p class="eyebrow">Current time</p>
          <div id="clock" class="clock">--:--:--</div>
          <div id="date" class="date">Loading date…</div>
        </section>

        <section class="launches-card">
          <div class="card-header">
            <div>
              <p class="eyebrow">Upcoming launches</p>
              <h1>Launches around the world</h1>
            </div>
            <div id="status" class="status-text">Loading launches…</div>
          </div>
          <div id="launch-list" class="launch-list"></div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
